name: 问题反馈
description: 报告图像显示、分析或运行问题
body:
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 软件版本、Windows 版本、显示缩放比例、显卡；自行编译时注明 Qt/OpenCV 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤及预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附截图、错误信息及不含隐私的最小测试图。安全漏洞请使用 SECURITY.md 中的渠道。
    validations:
      required: true
