name: Linux build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "构建基线（22.04 兼容面最广；24.04 产物不能在 22.04 上运行）"
        required: false
        default: "22.04"
        type: choice
        options:
          - "22.04"
          - "24.04"

permissions:
  # 标签发布时需要向 Release 上传 Ubuntu 包。
  contents: write

jobs:
  linux:
    # 默认 22.04：glibc 2.35 基线可同时覆盖 22.04/24.04，反向不成立。
    # 需要与开发机一致的 24.04 产物时，用 workflow_dispatch 选 24.04 手动跑一次。
    runs-on: ubuntu-${{ github.event.inputs.ubuntu_version || '22.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 安装 Qt 与 OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake qtbase5-dev libqt5svg5-dev \
            libqt5concurrent5 libqt5opengl5-desktop-dev \
            qttools5-dev qttools5-dev-tools libopencv-dev \
            qt5-image-formats-plugins patchelf xvfb
      - name: 记录构建基线
        run: |
          # DEB 的 glibc 下限由 runner 决定，发布后需按此行核对最低系统版本。
          lsb_release -ds || true
          ldd --version | head -1
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: 构建
        run: cmake --build build --config Release --parallel
      - name: 测试
        run: ./build/ImageViewerCoreTests
      - name: 读取版本号
        run: |
          APP_VERSION=$(grep -oP 'QString\("\K\d+\.\d+\.\d+(?="\))' src/app/AppVersion.h)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: 打包 DEB（内置全部运行库）
        run: ./scripts/package-deb.sh -b build -v "$APP_VERSION" -o dist
      - name: 上传安装包产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ImageViewer-${{ env.APP_VERSION }}-linux-x64.deb
          path: dist/*.deb
          retention-days: 14
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 与发布说明由 Windows 工作流创建；此处等待就绪后补充 Ubuntu 包。
          for i in $(seq 1 60); do
            if gh release view "v$APP_VERSION" > /dev/null 2>&1; then
              gh release upload "v$APP_VERSION" --clobber \
                "dist/ImageViewer-$APP_VERSION-linux-x64.deb"
              exit 0
            fi
            sleep 30
          done
          echo "等待 30 分钟后 Release v$APP_VERSION 仍未创建" >&2
          exit 1
